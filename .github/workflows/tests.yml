name: Wallet Detector Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install UI dependencies
        run: npm install
      - name: Typecheck dashboard
        run: npm run typecheck
      - name: Build dashboard
        run: npm run build
      - name: Smoke-test production server
        run: |
          npm run start > /tmp/wallet-detector-ui.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/dashboard.html; then
              break
            fi
            sleep 1
          done
          grep -q "Wallet Detector" /tmp/dashboard.html
          curl --fail --silent http://127.0.0.1:3000/api/dashboard > /tmp/dashboard.json
          grep -Eq '"mode":"(DEMO|LIVE|OFFLINE)"' /tmp/dashboard.json
          grep -q '"registry"' /tmp/dashboard.json
          grep -q '"windows"' /tmp/dashboard.json

  discovery-mainnet-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover wallets from real Solana blocks
        run: |
          python research/wallet_s10a0_wallet_universe_discovery.py \
            --lookback-slots 2 \
            --require-candidates \
            --out /tmp/stage10a0-mainnet-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path("/tmp/stage10a0-mainnet-smoke.json").read_text()
          )
          universe = payload["universe"]
          assert universe["source"]["kind"] == "SOLANA_JSON_RPC"
          assert universe["scan"]["scanned_block_count"] >= 1
          assert universe["scan"]["transaction_count"] >= 1
          assert universe["candidate_wallet_count"] >= 1
          print(json.dumps({
              "universe_fingerprint": universe["universe_fingerprint"],
              "scanned_block_count": universe["scan"]["scanned_block_count"],
              "transaction_count": universe["scan"]["transaction_count"],
              "candidate_wallet_count": universe["candidate_wallet_count"],
              "source_origin": universe["source"]["origin"],
          }, indent=2))
          PY

