name: Wallet History Population

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wallet-history-population.yml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      history_as_of_unix: ${{ steps.freeze.outputs.history_as_of_unix }}
      trader_wallet_count: ${{ steps.freeze.outputs.trader_wallet_count }}
      helius_configured: ${{ steps.capabilities.outputs.helius_configured }}
      supabase_write_configured: ${{ steps.capabilities.outputs.supabase_write_configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check optional server capabilities
        id: capabilities
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          WALLET_SUPABASE_SECRET_KEY: ${{ secrets.WALLET_SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            echo "helius_configured=true" >> "$GITHUB_OUTPUT"
            echo "Helius server credential configured: yes"
          else
            echo "helius_configured=false" >> "$GITHUB_OUTPUT"
            echo "Helius server credential configured: no"
          fi
          if [ -n "$WALLET_SUPABASE_SECRET_KEY" ]; then
            echo "supabase_write_configured=true" >> "$GITHUB_OUTPUT"
            echo "Supabase server write credential configured: yes"
          else
            echo "supabase_write_configured=false" >> "$GITHUB_OUTPUT"
            echo "Supabase server write credential configured: no"
          fi
      - name: Discover live candidate universe
        run: |
          python -m research.wallet_s10a0_wallet_universe_discovery \
            --lookback-slots 2 \
            --require-candidates \
            --out /tmp/stage10a0.json
      - name: Refine to trader candidates
        run: |
          python -m research.wallet_s10a1_candidate_refinement \
            --universe-file /tmp/stage10a0.json \
            --require-trader-candidates \
            --out /tmp/stage10a1a.json
      - name: Freeze population timestamp
        id: freeze
        run: |
          HISTORY_AS_OF=$(date +%s)
          echo "history_as_of_unix=$HISTORY_AS_OF" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          refinement = json.loads(
              Path("/tmp/stage10a1a.json").read_text()
          )["refinement"]
          trader_count = int(
              refinement["trader_candidate_wallet_count"]
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"trader_wallet_count={trader_count}\n")
          print(json.dumps({
              "refinement_fingerprint": refinement[
                  "refinement_fingerprint"
              ],
              "activity_candidate_wallet_count": refinement[
                  "activity_candidate_wallet_count"
              ],
              "trader_candidate_wallet_count": trader_count,
              "meme_buy_candidate_wallet_count": refinement[
                  "meme_buy_candidate_wallet_count"
              ],
          }, indent=2))
          PY
      - name: Upload frozen refinement
        uses: actions/upload-artifact@v4
        with:
          name: stage10a1b-frozen-refinement
          path: /tmp/stage10a1a.json
          retention-days: 14

  backfill:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen refinement
        uses: actions/download-artifact@v4
        with:
          name: stage10a1b-frozen-refinement
          path: /tmp/input
      - name: Plan this shard capacity
        env:
          HISTORY_AS_OF_UNIX: ${{ needs.prepare.outputs.history_as_of_unix }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          SHARD_DIR="/tmp/stage10a1b/shard-$SHARD_INDEX"
          mkdir -p "$SHARD_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from research.wallet_s10a1_candidate_refinement import (
              wallet_addresses_from_refinement,
          )
          from research.wallet_s10a1b_real_historical_backfill import (
              SolanaWalletHistoryRpc,
              build_refinement_shard,
              build_refinement_subset,
              plan_solana_rpc_history_capacity,
          )

          shard_index = int(os.environ["SHARD_INDEX"])
          refinement = json.loads(
              Path("/tmp/input/stage10a1a.json").read_text()
          )["refinement"]
          shard = build_refinement_shard(
              refinement,
              shard_index=shard_index,
              shard_count=8,
          )
          wallets = wallet_addresses_from_refinement(
              shard,
              trader_only=True,
          )
          source = SolanaWalletHistoryRpc(
              "https://api.mainnet.solana.com",
              source_label="solana-official-mainnet",
          )
          plan = plan_solana_rpc_history_capacity(
              source,
              wallets,
              as_of_unix=int(os.environ["HISTORY_AS_OF_UNIX"]),
              signature_page_limit=100,
              probe_max_pages_per_wallet=1,
          )

          root = Path(f"/tmp/stage10a1b/shard-{shard_index}")
          (root / "capacity-plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n"
          )

          if plan["standard_wallets"]:
              standard = build_refinement_subset(
                  shard,
                  plan["standard_wallets"],
              )
              (root / "standard-refinement.json").write_text(
                  json.dumps(
                      {"refinement": standard},
                      indent=2,
                      sort_keys=True,
                  ) + "\n"
              )

          if plan["high_volume_wallets"]:
              high_volume = build_refinement_subset(
                  shard,
                  plan["high_volume_wallets"],
              )
              (root / "high-volume-refinement.json").write_text(
                  json.dumps(
                      {"refinement": high_volume},
                      indent=2,
                      sort_keys=True,
                  ) + "\n"
              )

          print(json.dumps({
              "shard_index": shard_index,
              "wallet_count": len(wallets),
              "standard_wallet_count": plan["standard_wallet_count"],
              "high_volume_wallet_count": plan[
                  "high_volume_wallet_count"
              ],
              "plan_fingerprint": plan["plan_fingerprint"],
          }, indent=2))
          PY
      - name: Backfill STANDARD wallets in shard
        env:
          WALLET_SUPABASE_URL: https://yuqkodwdqaggsexbqiqa.supabase.co
          WALLET_SUPABASE_SECRET_KEY: ${{ secrets.WALLET_SUPABASE_SECRET_KEY }}
          HISTORY_AS_OF_UNIX: ${{ needs.prepare.outputs.history_as_of_unix }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          SHARD_DIR="/tmp/stage10a1b/shard-$SHARD_INDEX"
          if [ ! -f "$SHARD_DIR/standard-refinement.json" ]; then
            echo "No STANDARD wallets in shard $SHARD_INDEX"
            exit 0
          fi

          PERSIST_ARGS="--dry-run"
          if [ -n "$WALLET_SUPABASE_SECRET_KEY" ]; then
            PERSIST_ARGS=""
          fi

          python -m research.wallet_s10a1b_real_historical_backfill \
            --refinement-file "$SHARD_DIR/standard-refinement.json" \
            --provider solana-rpc \
            --history-as-of-unix "$HISTORY_AS_OF_UNIX" \
            --signature-page-limit 100 \
            --max-signature-pages-per-wallet 1 \
            --transaction-batch-size 1 \
            --rpc-min-request-interval-ms 500 \
            --evidence-only \
            --evidence-dir "$SHARD_DIR/evidence" \
            $PERSIST_ARGS \
            --out "$SHARD_DIR/result.json"
      - name: Upload shard plan and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage10a1b-shard-${{ matrix.shard }}
          path: /tmp/stage10a1b/shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14


  high_volume:
    needs: [prepare, backfill]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download first-pass shard artifact
        uses: actions/download-artifact@v4
        with:
          name: stage10a1b-shard-${{ matrix.shard }}
          path: /tmp/input
      - name: Deep-plan HIGH_VOLUME wallets
        env:
          HISTORY_AS_OF_UNIX: ${{ needs.prepare.outputs.history_as_of_unix }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          OUT="/tmp/stage10a1b-high/shard-$SHARD_INDEX"
          mkdir -p "$OUT"

          if [ ! -f /tmp/input/high-volume-refinement.json ]; then
            echo "No HIGH_VOLUME wallets in shard $SHARD_INDEX"
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(f"/tmp/stage10a1b-high/shard-{os.environ['SHARD_INDEX']}")
          (root / "high-volume-summary.json").write_text(
              json.dumps({
                  "source_high_volume_wallet_count": 0,
                  "public_rpc_eligible_wallet_count": 0,
                  "indexed_provider_wallet_count": 0,
                  "public_rpc_completed": False,
              }, indent=2, sort_keys=True) + "\n"
          )
          PY
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from research.wallet_s10a1_candidate_refinement import (
              wallet_addresses_from_refinement,
          )
          from research.wallet_s10a1b_real_historical_backfill import (
              SolanaWalletHistoryRpc,
              build_refinement_subset,
              plan_solana_rpc_history_capacity,
          )

          shard_index = int(os.environ["SHARD_INDEX"])
          as_of = int(os.environ["HISTORY_AS_OF_UNIX"])
          refinement = json.loads(
              Path("/tmp/input/high-volume-refinement.json").read_text()
          )["refinement"]
          wallets = wallet_addresses_from_refinement(
              refinement,
              trader_only=True,
          )

          source = SolanaWalletHistoryRpc(
              "https://api.mainnet.solana.com",
              source_label="solana-official-mainnet",
          )
          deep = plan_solana_rpc_history_capacity(
              source,
              wallets,
              as_of_unix=as_of,
              signature_page_limit=100,
              probe_max_pages_per_wallet=5,
          )

          root = Path(f"/tmp/stage10a1b-high/shard-{shard_index}")
          (root / "deep-capacity-plan.json").write_text(
              json.dumps(deep, indent=2, sort_keys=True) + "\n"
          )

          if deep["standard_wallets"]:
              eligible = build_refinement_subset(
                  refinement,
                  deep["standard_wallets"],
              )
              (root / "public-rpc-refinement.json").write_text(
                  json.dumps(
                      {"refinement": eligible},
                      indent=2,
                      sort_keys=True,
                  ) + "\n"
              )

          if deep["high_volume_wallets"]:
              indexed = build_refinement_subset(
                  refinement,
                  deep["high_volume_wallets"],
              )
              (root / "indexed-provider-refinement.json").write_text(
                  json.dumps(
                      {"refinement": indexed},
                      indent=2,
                      sort_keys=True,
                  ) + "\n"
              )

          summary = {
              "source_high_volume_wallet_count": len(wallets),
              "public_rpc_eligible_wallet_count": int(
                  deep["standard_wallet_count"]
              ),
              "indexed_provider_wallet_count": int(
                  deep["high_volume_wallet_count"]
              ),
              "public_rpc_signature_cap": 500,
              "public_rpc_completed": False,
          }
          (root / "high-volume-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY
      - name: Backfill HIGH_VOLUME public-RPC eligible wallets
        env:
          WALLET_SUPABASE_URL: https://yuqkodwdqaggsexbqiqa.supabase.co
          WALLET_SUPABASE_SECRET_KEY: ${{ secrets.WALLET_SUPABASE_SECRET_KEY }}
          HISTORY_AS_OF_UNIX: ${{ needs.prepare.outputs.history_as_of_unix }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          OUT="/tmp/stage10a1b-high/shard-$SHARD_INDEX"
          if [ ! -f "$OUT/public-rpc-refinement.json" ]; then
            echo "No <=500-signature HIGH_VOLUME wallets in shard $SHARD_INDEX"
            exit 0
          fi

          PERSIST_ARGS="--dry-run"
          if [ -n "$WALLET_SUPABASE_SECRET_KEY" ]; then
            PERSIST_ARGS=""
          fi

          python -m research.wallet_s10a1b_real_historical_backfill \
            --refinement-file "$OUT/public-rpc-refinement.json" \
            --provider solana-rpc \
            --history-as-of-unix "$HISTORY_AS_OF_UNIX" \
            --signature-page-limit 100 \
            --max-signature-pages-per-wallet 5 \
            --transaction-batch-size 1 \
            --rpc-min-request-interval-ms 500 \
            --evidence-only \
            --evidence-dir "$OUT/public-rpc-evidence" \
            $PERSIST_ARGS \
            --out "$OUT/public-rpc-result.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(f"/tmp/stage10a1b-high/shard-{os.environ['SHARD_INDEX']}")
          summary = json.loads(
              (root / "high-volume-summary.json").read_text()
          )
          summary["public_rpc_completed"] = True
          result = json.loads(
              (root / "public-rpc-result.json").read_text()
          )["backfill"]
          summary["public_rpc_raw_transaction_rows"] = int(
              result["fetch"]["raw_transaction_rows_across_wallets"]
          )
          summary["public_rpc_normalized_event_rows"] = int(
              result["normalization"]["normalized_event_count"]
          )
          (root / "high-volume-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Backfill remaining HIGH_VOLUME with Helius when configured
        if: needs.prepare.outputs.helius_configured == 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          WALLET_SUPABASE_URL: https://yuqkodwdqaggsexbqiqa.supabase.co
          WALLET_SUPABASE_SECRET_KEY: ${{ secrets.WALLET_SUPABASE_SECRET_KEY }}
          HISTORY_AS_OF_UNIX: ${{ needs.prepare.outputs.history_as_of_unix }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          OUT="/tmp/stage10a1b-high/shard-$SHARD_INDEX"
          if [ ! -f "$OUT/indexed-provider-refinement.json" ]; then
            echo "No remaining indexed-provider wallets in shard $SHARD_INDEX"
            exit 0
          fi

          PERSIST_ARGS="--dry-run"
          if [ -n "$WALLET_SUPABASE_SECRET_KEY" ]; then
            PERSIST_ARGS=""
          fi

          python -m research.wallet_s10a1b_real_historical_backfill \
            --refinement-file "$OUT/indexed-provider-refinement.json" \
            --provider helius \
            --history-as-of-unix "$HISTORY_AS_OF_UNIX" \
            --evidence-only \
            --evidence-dir "$OUT/indexed-evidence" \
            $PERSIST_ARGS \
            --out "$OUT/indexed-result.json"
      - name: Upload HIGH_VOLUME plan and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage10a1b-high-volume-shard-${{ matrix.shard }}
          path: /tmp/stage10a1b-high/shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14


  summarize:
    needs: [prepare, backfill, high_volume]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage10a1b-shard-*
          path: /tmp/shards
          merge-multiple: false
      - name: Download HIGH_VOLUME artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage10a1b-high-volume-shard-*
          path: /tmp/high-volume
          merge-multiple: false
      - name: Summarize population coverage
        env:
          EXPECTED_TRADER_COUNT: ${{ needs.prepare.outputs.trader_wallet_count }}
          HELIUS_CONFIGURED: ${{ needs.prepare.outputs.helius_configured }}
          SUPABASE_WRITE_CONFIGURED: ${{ needs.prepare.outputs.supabase_write_configured }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          standard = 0
          high_volume = 0
          raw_rows = 0
          normalized_rows = 0
          completed_standard_shards = 0
          failed_or_incomplete_standard_shards = 0
          public_rpc_hv_wallets = 0
          indexed_provider_wallets = 0
          public_rpc_hv_raw_rows = 0
          public_rpc_hv_normalized_rows = 0
          public_rpc_hv_incomplete_shards = 0

          for plan_path in Path("/tmp/shards").rglob("capacity-plan.json"):
              plan = json.loads(plan_path.read_text())
              standard += int(plan["standard_wallet_count"])
              high_volume += int(plan["high_volume_wallet_count"])

              shard_root = plan_path.parent
              standard_file = shard_root / "standard-refinement.json"
              result_file = shard_root / "result.json"
              if standard_file.exists():
                  if result_file.exists():
                      result = json.loads(result_file.read_text())
                      backfill = result["backfill"]
                      raw_rows += int(
                          backfill["fetch"][
                              "raw_transaction_rows_across_wallets"
                          ]
                      )
                      normalized_rows += int(
                          backfill["normalization"][
                              "normalized_event_count"
                          ]
                      )
                      completed_standard_shards += 1
                  else:
                      failed_or_incomplete_standard_shards += 1

          for summary_path in Path("/tmp/high-volume").rglob(
              "high-volume-summary.json"
          ):
              hv = json.loads(summary_path.read_text())
              public_rpc_hv_wallets += int(
                  hv.get("public_rpc_eligible_wallet_count") or 0
              )
              indexed_provider_wallets += int(
                  hv.get("indexed_provider_wallet_count") or 0
              )
              if int(hv.get("public_rpc_eligible_wallet_count") or 0):
                  if bool(hv.get("public_rpc_completed")):
                      public_rpc_hv_raw_rows += int(
                          hv.get("public_rpc_raw_transaction_rows") or 0
                      )
                      public_rpc_hv_normalized_rows += int(
                          hv.get("public_rpc_normalized_event_rows") or 0
                      )
                  else:
                      public_rpc_hv_incomplete_shards += 1

          expected = int(os.environ["EXPECTED_TRADER_COUNT"])
          summary = {
              "expected_trader_wallet_count": expected,
              "standard_wallet_count": standard,
              "high_volume_wallet_count": high_volume,
              "lane_partition_complete": (
                  standard + high_volume == expected
              ),
              "completed_standard_shards": completed_standard_shards,
              "failed_or_incomplete_standard_shards": (
                  failed_or_incomplete_standard_shards
              ),
              "standard_raw_transaction_rows": raw_rows,
              "standard_normalized_event_rows": normalized_rows,
              "helius_configured": (
                  os.environ["HELIUS_CONFIGURED"] == "true"
              ),
              "supabase_write_configured": (
                  os.environ["SUPABASE_WRITE_CONFIGURED"] == "true"
              ),
              "high_volume_public_rpc_wallet_count": (
                  public_rpc_hv_wallets
              ),
              "high_volume_indexed_provider_wallet_count": (
                  indexed_provider_wallets
              ),
              "high_volume_public_rpc_raw_rows": (
                  public_rpc_hv_raw_rows
              ),
              "high_volume_public_rpc_normalized_rows": (
                  public_rpc_hv_normalized_rows
              ),
              "high_volume_public_rpc_incomplete_shards": (
                  public_rpc_hv_incomplete_shards
              ),
              "high_volume_second_lane_partition_complete": (
                  public_rpc_hv_wallets + indexed_provider_wallets
                  == high_volume
              ),
              "high_volume_policy": (
                  "PUBLIC_RPC_UP_TO_500_SIGNATURES_ELSE_INDEXED_PROVIDER"
              ),
          }
          print(json.dumps(summary, indent=2))
          Path("/tmp/stage10a1b-population-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          assert summary["lane_partition_complete"]
          assert summary["failed_or_incomplete_standard_shards"] == 0
          assert summary["high_volume_second_lane_partition_complete"]
          assert summary["high_volume_public_rpc_incomplete_shards"] == 0
          PY
      - name: Upload population summary
        uses: actions/upload-artifact@v4
        with:
          name: stage10a1b-population-summary
          path: /tmp/stage10a1b-population-summary.json
          retention-days: 14
